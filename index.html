<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punjabi Food Cafe | Delicious Food & Mocktails</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: #0f0f11;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      background: rgba(15, 15, 17, 0.9);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #ff9f1c;
      text-transform: uppercase;
    }

    .logo span {
      color: #2ec4b6;
    }

    .order-btn-nav {
      background: #ff9f1c;
      color: #000;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 25px;
      text-decoration: none;
      transition: 0.3s;
    }

    .order-btn-nav:hover {
      background: #ffffff;
      transform: scale(1.05);
    }

    /* Hero Section */
    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 20px 40px;
      background: radial-gradient(circle at center, rgba(255, 159, 28, 0.15) 0%, rgba(15, 15, 17, 1) 70%);
    }

    .badge {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #ff9f1c;
      margin-bottom: 15px;
      display: inline-block;
    }

    .hero h1 {
      font-size: 38px;
      line-height: 1.2;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .hero h1 span {
      color: #ff9f1c;
    }

    .hero p {
      font-size: 14px;
      color: #a0a0a5;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .hero-btns {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background: #25D366; /* WhatsApp Green */
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: 0.3s;
    }

    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-primary:hover, .btn-secondary:hover {
      transform: translateY(-2px);
    }

    /* Rating Pill */
    .rating-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .rating-pill i {
      color: #f1c40f;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">PFC <span>Cafe</span></div>
    <a href="#menu" class="order-btn-nav">Explore Menu</a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="badge">🔥 RAMGARH'S FAVORITE HANGOUT SPOT</div>
    <h1>Delicious Food & <br><span>Chilled Mocktails</span></h1>
    <p>Come, sit & gossip with friends and family. Experience the best taste, vibrant vibes, and quick bites at Punjabi Food Cafe.</p>
    
    <div class="hero-btns">
      <a href="https://wa.me/" class="btn-primary" target="_blank">
        <i class="fab fa-whatsapp"></i> Order on WhatsApp
      </a>
      <a href="#menu" class="btn-secondary">View Menu</a>
    </div>

    <div class="rating-pill">
      <i class="fas fa-star"></i>
      <span><strong>4.1</strong> Google Rating (400+ Reviews)</span>
    </div>
  </section>

</body>
</html>
